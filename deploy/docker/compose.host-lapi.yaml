# CrowdSec Guard — Optional Host Local API Diagnostics
# Usage: docker compose -f deploy/docker/compose.yaml -f deploy/docker/compose.host-lapi.yaml up -d
# Security Warning: Binds LAPI to 127.0.0.1 for trusted host tooling only. Never expose to 0.0.0.0.

services:
  crowdsec:
    ports:
      - "127.0.0.1:${HOST_LAPI_PORT:-8080}:8080"
